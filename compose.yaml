services:

  db:
    container_name: postgres-uni_manage
    image: postgres:latest
    environment:
      POSTGRES_USER: universitymanage
      POSTGRES_PASSWORD: kuetcse
      POSTGRES_DB: unimanage
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped


  app:
    container_name: uni_manage-app
    build: .
    ports:
      - "8081:8081"
    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/unimanage
      SPRING_DATASOURCE_USERNAME: universitymanage
      SPRING_DATASOURCE_PASSWORD: kuetcse
    depends_on:
      - db
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge #standard network type for containers on one computer.

volumes:
  db:
